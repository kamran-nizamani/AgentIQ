name: AgentIQ Evidence
"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download the test report from the original CI run
        uses: actions/download-artifact@v4
        with:
          name: agentiq-test-results
          path: upstream-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true
      - name: Emit evidence from the original run only
        env:
          AGENTIQ_RUN_ID: ${{ github.event.workflow_run.id }}
          AGENTIQ_ARTIFACT_RUN_ID: ${{ github.run_id }}
          AGENTIQ_REPOSITORY: ${{ github.repository }}
          AGENTIQ_SHA: ${{ github.event.workflow_run.head_sha }}
          AGENTIQ_WORKFLOW: ${{ github.event.workflow_run.name }}
          AGENTIQ_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const reportPath = "upstream-artifacts/test-results.json";
          if (!fs.existsSync(reportPath)) {
            console.warn("Original CI run did not upload agentiq-test-results; no test evidence will be generated.");
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const total = Number(report.numTotalTests);
          const passed = Number(report.numPassedTests ?? 0);
          const failed = Number(report.numFailedTests ?? 0);
          const skipped = Number(report.numPendingTests ?? 0) + Number(report.numTodoTests ?? 0);
          if (![total, passed, failed, skipped].every(Number.isSafeInteger) ||
              [total, passed, failed, skipped].some((count) => count < 0) ||
              total <= 0 || passed + failed + skipped !== total) {
            throw new Error("Original CI test report has missing, invalid, or inconsistent counts.");
          }

          const now = new Date().toISOString();
          const repository = process.env.AGENTIQ_REPOSITORY;
          const workflowRunId = String(process.env.AGENTIQ_RUN_ID);
          const commitSha = process.env.AGENTIQ_SHA;
          const evidence = {
            schemaVersion: "1.0",
            evidence: [
              {
                id: "github-actions:run:" + workflowRunId,
                kind: "workflow-run",
                timestamp: now,
                provenance: {
                  source: "github-actions",
                  sourceId: workflowRunId,
                  collectedAt: now,
                  schemaVersion: "1.0"
                },
                data: {
                  repository,
                  workflowRunId,
                  artifactRunId: process.env.AGENTIQ_ARTIFACT_RUN_ID,
                  commitSha,
                  workflowName: process.env.AGENTIQ_WORKFLOW,
                  conclusion: process.env.AGENTIQ_CONCLUSION
                }
              },
              {
                id: "test-suite:vitest:" + workflowRunId,
                kind: "test-suite",
                timestamp: now,
                provenance: {
                  source: "test-report",
                  sourceId: "vitest:" + workflowRunId + ":" + commitSha,
                  collectedAt: now,
                  schemaVersion: "1.0"
                },
                data: {
                  repository,
                  workflowRunId,
                  commitSha,
                  framework: "vitest",
                  total,
                  passed,
                  failed,
                  skipped
                }
              }
            ]
          };

          fs.copyFileSync(reportPath, "test-results.json");
          fs.writeFileSync("agentiq-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          console.log(JSON.stringify({ repository, workflowRunId, commitSha, conclusion: process.env.AGENTIQ_CONCLUSION, tests: { total, passed, failed, skipped } }));
          NODE
      - name: Upload verified-source evidence artifact
        if: hashFiles('agentiq-evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agentiq-evidence
          path: |
            agentiq-evidence.json
            test-results.json
          if-no-files-found: error
          retention-days: 14
